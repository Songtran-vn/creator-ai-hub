<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quản trị · Creator AI Hub</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.adm-grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.tbl-wrap{overflow-x:auto}
td input,td select{margin:0;padding:6px 8px;min-width:70px}
.st{font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px}
.st.pending{background:#fef3c7;color:#92400e}.st.approved{background:#dcfce7;color:#166534}.st.blocked{background:#fee2e2;color:#991b1b}
.row-actions{display:flex;gap:6px;flex-wrap:wrap}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.filters input,.filters select{width:auto;flex:1;min-width:160px;margin:0}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal" class="modal hidden"><div class="modal-box"><button class="x" onclick="closeModal()">×</button><div id="modal-body"></div></div></div>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="data.js"></script>
<script src="admin.js"></script>
</body>
</html>
